let raf;function hero(){cancelAnimationFrame(raf);const cv=$('#cv');if(!window.THREE||!cv)return;const T=THREE,r=new T.WebGLRenderer({canvas:cv,alpha:true,antialias:true}),sc=new T.Scene(),cam=new T.PerspectiveCamera(60,1,.1,100);cam.position.z=6;
 const os=[[-3.5,0,0x3b82f6],[0,.2,0x8b5cf6],[3.5,0,0x06b6d4]].map(([x,y,c],i)=>{const m=new T.Mesh(new T.IcosahedronGeometry(.9,1),new T.MeshBasicMaterial({color:c,wireframe:true}));m.position.set(x,y,-i%2);sc.add(m);return m});
 const g=new T.BufferGeometry(),a=new Float32Array(1800);for(let i=0;i<1800;i++)a[i]=(Math.random()-.5)*(i%3?14:24);g.setAttribute('position',new T.BufferAttribute(a,3));const pt=new T.Points(g,new T.PointsMaterial({size:.04,color:0xc4b5fd}));sc.add(pt);
 let mx=0;addEventListener('pointermove',e=>mx=e.clientX/innerWidth-.5);
 const rs=()=>{const w=cv.clientWidth,h=cv.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()};rs();addEventListener('resize',rs);
 (function f(t){raf=requestAnimationFrame(f);t/=1000;os.forEach((m,i)=>{m.rotation.x=t*.5+i;m.rotation.y=t*.7;m.position.y=Math.sin(t*1.5+i)*.5});pt.rotation.y=t*.05+mx;r.render(sc,cam)})(0)}

const tok=s=>[...new Set((s||'').toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(w=>w.length>2||/[^\x00-\x7F]/.test(w)))],bn=s=>/[\u0980-\u09FF]/.test(s);
function ans(q){const fav={};S.favs.forEach(f=>{const c=(f.cat||'other').toLowerCase();(fav[c]=fav[c]||[]).push(f.title)});
 const kb=[...S.faqs.map(f=>({k:f.q+' '+(f.kw||''),a:f.a,w:2})),...Object.entries(S.profile).filter(([k,v])=>v&&k!=='photo').map(([k,v])=>({k:k+' '+v,a:v,w:1})),...Object.entries(fav).map(([c,t])=>({k:'favorite '+c+' '+t.join(' '),a:c+': '+t.join(', '),w:1})),...S.posts.map(x=>({k:x.title+' '+x.body,a:x.title+': '+(x.body||'').slice(0,300)+'…',w:1}))];
 const t=new Set(tok(q));let b,bs=0;for(const e of kb){const s=tok(e.k).filter(w=>t.has(w)).length*e.w;if(s>bs){bs=s;b=e}}
 return b?b.a:bn(q)?'দুঃখিত, এই তথ্যটি আমার কাছে নেই।':'Sorry, that information isn’t available.'}

 if(d.tab){tab=d.tab;D={};eid=null;adm()}
 if(d.act==='save'){if(c.file&&!D[c.file])return toast('Choose a file first');if(eid)S[tab]=S[tab].map(x=>x.id===eid?D:x);else{D.id=Date.now().toString(36);D.date=new Date().toISOString().slice(0,10);S[tab].unshift(D)}D={};eid=null;adm();toast('Added — now publish')}
 if(d.act==='edit'){D={...S[tab].find(x=>x.id===d.id)};eid=d.id;adm()}
 if(d.act==='del'&&confirm('Delete this item?')){S[tab]=S[tab].filter(x=>x.id!==d.id);adm()}
 if(d.act==='pub'){try{const j=JSON.stringify(S).replace(/</g,'\\u003c');await A.publish(SRC.replace(/(<script id="kma-data" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+j+b))}catch(x){toast(x.code==='conflict'?'Someone else published first. Reloading…':'Publish failed')}}});
